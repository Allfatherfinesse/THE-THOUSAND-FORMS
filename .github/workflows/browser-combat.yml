name: Browser combat
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rules-and-bundle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Browser/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - name: Verify committed playable bundle
        run: git diff --exit-code -- dist/game.bundle.js dist/game.bundle.js.LEGAL.txt
